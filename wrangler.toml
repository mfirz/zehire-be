name = "zehire-backend"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Development settings
[dev]
port = 8787
local_protocol = "http"

# =============================================================================
# D1 DATABASE BINDINGS
# =============================================================================
# D1 is bound per-environment to allow separate databases for dev/staging/prod.
# The binding name "DB" must match the Env interface in src/types/bindings.ts.

# Local development uses a local D1 instance (SQLite file)
[[d1_databases]]
binding = "DB"
database_name = "zehire-db-dev"
database_id = "local"  # Placeholder for local development

# =============================================================================
# WORKERS AI BINDING
# =============================================================================
# Workers AI provides free LLM inference on Cloudflare's edge.
# Free tier: 10,000 neurons/day
# Models: @cf/meta/llama-3.1-8b-instruct, @cf/mistral/mistral-7b-instruct-v0.1
# Note: AI runs remotely even in local dev (uses your free quota)
[ai]
binding = "AI"
remote = true

# =============================================================================
# QUEUE BINDINGS
# =============================================================================
# Cloudflare Queues for durable async job processing.
# Free tier: 1 million operations/month
# Message limit: 128 KB (we only send job IDs, so ~30 bytes)

# Producer binding - sends messages to the queue
[[queues.producers]]
binding = "JOB_QUEUE"
queue = "zehire-jobs-dev"

# Consumer binding - processes messages from the queue
[[queues.consumers]]
queue = "zehire-jobs-dev"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "zehire-jobs-dlq-dev"

# =============================================================================
# ENVIRONMENT: STAGING
# =============================================================================
[env.staging]
name = "zehire-be-staging"

# Staging D1 database
# Create with: wrangler d1 create zehire-db-staging
# Then replace database_id with the actual ID from the output
[[env.staging.d1_databases]]
binding = "DB"
database_name = "zehire-db-staging"
database_id = "REPLACE_WITH_STAGING_DATABASE_ID"

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "debug"
LLM_PROVIDER = "workers-ai"  # "workers-ai" (free) or "anthropic" (paid)

# Staging queue bindings
[[env.staging.queues.producers]]
binding = "JOB_QUEUE"
queue = "zehire-jobs-staging"

[[env.staging.queues.consumers]]
queue = "zehire-jobs-staging"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "zehire-jobs-dlq-staging"

# =============================================================================
# ENVIRONMENT: PRODUCTION
# =============================================================================
[env.production]
name = "zehire-be"

# Production D1 database
# Create with: wrangler d1 create zehire-db-production
# Then replace database_id with the actual ID from the output
[[env.production.d1_databases]]
binding = "DB"
database_name = "zehire-db-production"
database_id = "REPLACE_WITH_PRODUCTION_DATABASE_ID"

[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
LLM_PROVIDER = "workers-ai"  # "workers-ai" (free) or "anthropic" (paid)

# Production queue bindings
[[env.production.queues.producers]]
binding = "JOB_QUEUE"
queue = "zehire-jobs-production"

[[env.production.queues.consumers]]
queue = "zehire-jobs-production"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "zehire-jobs-dlq-production"

# =============================================================================
# SECRETS (set via wrangler secret put)
# =============================================================================
# Required secrets for each environment:
#
# ANTHROPIC_API_KEY - API key for Claude LLM calls
#   wrangler secret put ANTHROPIC_API_KEY --env staging
#   wrangler secret put ANTHROPIC_API_KEY --env production
#
# =============================================================================
